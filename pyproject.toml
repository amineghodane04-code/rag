[project]
name = "rag"
version = "0.1.0"
description = "RAG against the machine - 42 AI project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "fire>=0.6.0",
    "tqdm>=4.66.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", ".venv*", "vllm*", "moulinette*", "scratch", "datasets*"]
